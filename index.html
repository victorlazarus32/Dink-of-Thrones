    /* ========================= BASE ========================= */
    body {
      background: var(--body-bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-body);
      margin: 0;
      padding: 6px 10px;
      transition: background-color 0.3s, color 0.3s;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: var(--overlay);
      pointer-events: none;
      z-index: -1;
    }
    .container { max-width: 1500px; margin: 0 auto; }
    .banner { display: flex; justify-content: center; margin-bottom: 6px; }
    .banner-logo-wrap {
      background: var(--logo-wrap-bg);
      border: var(--logo-wrap-border);
      border-radius: var(--logo-wrap-radius);
      padding: var(--logo-wrap-pad);
      box-shadow: var(--logo-wrap-shadow);
    }
    .banner-logo {
      display: block;
      max-width: var(--logo-max);
      width: 52vw;
      height: auto;
      object-fit: contain;
      filter: var(--logo-filter);
    }
    h1 {
      text-align: center;
      margin: 8px 0 2px 0;
      font-family: var(--font-head);
      font-weight: 900;
      font-size: 2rem;
      letter-spacing: var(--title-spacing);
      text-transform: uppercase;
      color: var(--accent);
      background: var(--title-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      user-select: none;
    }
    #eventTitle .edit-icon {
      display: inline-block;
      font-size: 0.5em;
      opacity: 0.55;
      margin-left: 8px;
      vertical-align: middle;
      -webkit-text-fill-color: var(--accent);
    }
    #eventTitle:hover .edit-icon { opacity: 1; }
    #eventTitleInput {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
      color: var(--title-input-color);
      /* the h1 paints its gradient with a transparent text fill, which the
         input would otherwise inherit — making whatever you type invisible */
      -webkit-text-fill-color: var(--title-input-color);
      caret-color: var(--title-input-color);
      background: var(--title-input-bg);
      background-clip: border-box;
      -webkit-background-clip: border-box;
      border: var(--title-input-border);
      border-radius: 8px;
      padding: 6px 14px;
      width: 92%;
      max-width: 560px;
      box-sizing: border-box;
      box-shadow: var(--title-input-shadow);
    }
    .sub {
      text-align: center;
      font-family: var(--font-body);
      font-style: var(--fs-flavor);
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }
    .title-hint {
      text-align: center;
      font-family: var(--font-body);
      font-size: 0.68rem;
      color: var(--text-dim);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    /* ==================== THEME CONTROLS ==================== */
    .theme-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .theme-bar-label {
      font-family: var(--font-head);
      font-size: 0.64rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-right: 2px;
    }
    .theme-chip {
      width: auto;
      margin-top: 0;
      padding: 5px 13px;
      border-radius: 999px;
      font-family: var(--font-head);
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--chip-bg);
      color: var(--chip-color);
      border: var(--chip-border);
      box-shadow: none;
    }
    .theme-chip.selected {
      background: var(--chip-sel-bg);
      color: var(--chip-sel-color);
      border-color: var(--chip-sel-border);
    }
    .theme-picker {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      margin-bottom: 4px;
    }
    @media (max-width: 560px) {
      .theme-picker { grid-template-columns: 1fr; }
    }
    .theme-option {
      width: 100%;
      margin-top: 0;
      text-align: left;
      text-transform: none;
      letter-spacing: normal;
      padding: 11px 13px;
      border-radius: var(--card-radius);
      background: var(--option-bg);
      border: var(--option-border);
      box-shadow: none;
    }
    .theme-option:hover { transform: none; }
    .theme-option.selected {
      border-color: var(--accent);
      box-shadow: var(--option-sel-shadow);
    }
    .to-name {
      display: block;
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 0.92rem;
      color: var(--text);
      letter-spacing: 0.04em;
      margin-bottom: 3px;
    }
    .to-desc {
      display: block;
      font-family: var(--font-body);
      font-style: var(--fs-flavor);
      font-size: 0.73rem;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.01em;
      line-height: 1.35;
      text-transform: none;
    }
    .swatches { display: flex; gap: 5px; margin-top: 7px; }
    .swatch {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 1px solid rgba(128,128,128,0.35);
    }
    /* ========================= CARDS ========================= */
    .card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: 12px 14px;
      margin-bottom: 10px;
      border: var(--card-border);
      box-shadow: var(--card-shadow);
      position: relative;
      backdrop-filter: var(--card-blur, none);
      -webkit-backdrop-filter: var(--card-blur, none);
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: var(--card-strip-inset);
      right: var(--card-strip-inset);
      height: var(--card-strip-h);
      border-radius: 0 0 3px 3px;
      background: var(--card-strip-bg);
      pointer-events: none;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 0.94rem;
      color: var(--h3-color);
      letter-spacing: var(--h3-spacing);
      text-transform: uppercase;
      border-bottom: var(--h3-border);
      padding-bottom: 6px;
    }
    h3.collapsible {
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    h3.collapsible .caret {
      font-size: 0.8em;
      opacity: 0.65;
      transition: transform 0.2s;
    }
    h3.collapsible.open .caret { transform: rotate(180deg); }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 9px 10px;
      margin-bottom: 6px;
      border-radius: var(--input-radius);
      border: var(--input-border);
      background: var(--input-bg);
      color: var(--input-color);
      box-sizing: border-box;
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.02em;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: var(--input-focus-border);
      box-shadow: var(--input-focus-ring);
    }
    input::placeholder {
      color: var(--input-placeholder);
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    button {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--btn-radius);
      border: 1px solid transparent;
      cursor: pointer;
      font-family: var(--font-head);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: var(--btn-spacing);
      text-transform: uppercase;
      margin-top: 6px;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.06); }
    button:active { transform: translateY(0); filter: brightness(0.95); }
    .btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-color);
      border-color: var(--btn-primary-border);
      box-shadow: var(--btn-primary-shadow);
    }
    .btn-secondary {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-color);
      border: var(--btn-secondary-border);
    }
    .btn-danger {
      background: var(--btn-danger-bg);
      color: var(--btn-danger-color);
      border-color: var(--btn-danger-border);
      box-shadow: var(--btn-danger-shadow);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 6px;
    }
    .layout-stack { display: flex; flex-direction: column; gap: 8px; }
    .courts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
    }
    .button-row button { margin-top: 0; }
    .history-flex { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
    .history-flex .history-round {
      min-width: 190px;
      flex: 0 0 auto;
      background: var(--history-bg);
      border: var(--history-border);
      border-radius: var(--history-radius);
      box-shadow: var(--history-shadow);
      padding: 6px 8px;
      margin-bottom: 0;
    }
    @media (max-width: 900px) {
      .courts-grid { grid-template-columns: 1fr; }
      .button-row { grid-template-columns: 1fr; }
    }
    /* ========================= COURTS ========================= */
    .court {
      background: var(--court-bg);
      border-radius: var(--court-radius);
      border: var(--court-border);
      border-left: var(--court-accent-w) solid var(--house-color, var(--accent));
      padding: 8px 10px;
      margin-bottom: 0;
      box-shadow: var(--court-shadow);
    }
    .court h4 {
      margin: 0 0 6px 0;
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--court-h4-color);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .court-tag {
      font-family: var(--font-body);
      font-style: var(--fs-flavor);
      font-weight: 600;
      font-size: 0.73rem;
      color: var(--house-color, var(--text-muted));
      margin-left: 4px;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .court-tag .edit-icon-sm { font-size: 0.85em; opacity: 0.5; margin-left: 3px; }
    .court-tag:hover .edit-icon-sm { opacity: 1; }
    .court-tag-input {
      font-family: var(--font-body);
      font-style: var(--fs-flavor);
      font-size: 0.73rem;
      color: var(--title-input-color);
      -webkit-text-fill-color: var(--title-input-color);
      caret-color: var(--title-input-color);
      background: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 2px 8px;
      margin-left: 4px;
      letter-spacing: 0.02em;
      width: 160px;
      max-width: 60vw;
    }
    .court[data-house="1"] { --house-color: var(--house-1); }
    .court[data-house="2"] { --house-color: var(--house-2); }
    .court[data-house="3"] { --house-color: var(--house-3); }
    .court[data-house="4"] { --house-color: var(--house-4); }
    .court[data-house="5"] { --house-color: var(--house-5); }
    .court[data-house="6"] { --house-color: var(--house-6); }
    .side {
      display: flex;
      gap: 5px;
      min-width: 0;
    }
    .side .team-pill { flex: 1 1 0; min-width: 0; }
    .pill-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .court.is-singles .team-pill {
      font-size: 0.82rem;
      padding: 7px 9px;
    }
    .court.is-singles .team-row { grid-template-columns: 2.5fr 1fr; }
    .team-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 6px;
      align-items: center;
      margin-bottom: 4px;
    }
    .team-pill {
      background: var(--pill-bg);
      border-radius: var(--pill-radius);
      padding: 8px 12px;
      border: var(--pill-border);
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.02em;
      color: var(--pill-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--pill-shadow);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .team-pill:active { cursor: grabbing; }
    .message {
      font-family: var(--font-body);
      font-style: var(--fs-flavor);
      font-size: 0.85rem;
      margin-top: 6px;
      letter-spacing: 0.02em;
    }
    .message-error { color: var(--msg-error); }
    .message-success { color: var(--msg-success); }
    /* ======================= STANDINGS ======================= */
    .stand-team {
      background: var(--stand-bg);
      border-radius: var(--pill-radius);
      border: var(--stand-border);
      box-shadow: var(--stand-shadow);
      padding: 6px 12px;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.86rem;
      letter-spacing: 0.02em;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .stand-team:hover {
      border-color: var(--stand-hover-border);
      box-shadow: var(--stand-hover-shadow);
    }
    .stand-team.is-champ {
      background: var(--champ-bg);
      border: var(--champ-border);
      box-shadow: var(--champ-shadow);
    }
    .stand-team.is-last {
      background: var(--last-bg);
      border: var(--last-border);
      opacity: var(--last-opacity);
    }
    .rank-badge {
      display: inline-block;
      min-width: 26px;
      text-align: center;
      border-radius: var(--badge-radius);
      background: var(--badge-bg);
      border: var(--badge-border);
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 0.76rem;
      color: var(--badge-color);
      margin-right: 10px;
      padding: 2px 7px;
    }
    .rank-badge.champ {
      background: var(--badge-champ-bg);
      border-color: var(--badge-champ-border);
      color: var(--badge-champ-color);
      animation: var(--badge-champ-anim);
    }
    @keyframes goldPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(212,168,83,0.45); }
      50%      { box-shadow: 0 0 18px rgba(212,168,83,0.9); }
    }
    @keyframes foodPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(245,165,36,0.45); }
      50%      { box-shadow: 0 0 18px rgba(224,69,44,0.6); }
    }
    @keyframes miamiPulse {
      0%, 100% { box-shadow: 0 0 8px rgba(255,46,147,0.4); }
      50%      { box-shadow: 0 0 18px rgba(0,194,255,0.55); }
    }
    .rank-badge.purg {
      background: var(--badge-purg-bg);
      border-color: var(--badge-purg-border);
      color: var(--badge-purg-color);
    }
    .win { color: var(--win-color); font-weight: 700; }
    .loss { color: var(--loss-color); font-weight: 700; }
    .diff {
      color: var(--diff-color);
      font-family: var(--font-body);
      font-style: var(--fs-flavor);
      font-weight: 600;
      font-size: 0.78rem;
      margin-left: 8px;
      letter-spacing: 0.02em;
    }
    /* ======================== HISTORY ======================== */
    .history-round {
      font-family: var(--font-body);
      font-size: 0.82rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    .history-header {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 5px;
      color: var(--history-head-color);
      border-bottom: var(--history-head-border);
      padding-bottom: 4px;
    }
    .history-item { color: var(--history-item-color); margin-left: 0; line-height: 1.5; }
    .history-winner {
      color: var(--history-winner-color);
      font-weight: 800;
      font-style: var(--fs-flavor);
    }
    .history-byes {
      color: var(--text-muted);
      font-style: var(--fs-flavor);
      font-size: 0.78rem;
      margin-bottom: 4px;
      padding-bottom: 3px;
      border-bottom: var(--history-byes-border);
    }
    .history-byes strong { color: var(--h3-color); font-style: normal; letter-spacing: 0.02em; }
    /* ==================== BYES / DRAG-SWAP ==================== */
    .byes-section { margin-bottom: 8px; }
    .byes-header {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 0.76rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 5px;
    }
    .byes-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .byes-empty {
      font-family: var(--font-body);
      font-style: var(--fs-flavor);
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .bye-pill {
      background: var(--bye-bg);
      border: var(--bye-border);
      border-radius: var(--bye-radius);
      padding: 7px 12px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.84rem;
      color: var(--bye-color);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .bye-pill:active { cursor: grabbing; }
    .bye-tag {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--bye-tag-color);
      border: var(--bye-tag-border);
      border-radius: 4px;
      padding: 2px 5px;
    }
    .drag-handle { opacity: 0.4; font-size: 0.9em; margin-left: 6px; color: var(--text-muted); }
    .pill-dragging-source { opacity: 0.35; }
    .drag-over {
      outline: 2px dashed var(--drag-outline);
      outline-offset: 2px;
      background: var(--drag-bg);
    }
    .drag-ghost {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.92;
      transform: translate(-50%, -50%) scale(1.04);
      box-shadow: var(--ghost-shadow);
    }
    .link-btn {
      width: auto;
      margin-top: 0;
      padding: 3px 9px;
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      border: var(--chip-border);
      box-shadow: none;
    }
    .round-info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    #roundInfo {
      font-family: var(--font-body);
      font-style: var(--fs-flavor);
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    /* ===================== MANAGE TEAMS ===================== */
    .manage-hint {
      font-family: var(--font-body);
      font-style: var(--fs-flavor);
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    /* ================== EDITABLE PAST SCORES ================== */
    h3.h3-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .history-flex.editing .history-round { min-width: 232px; }
    .hist-match-block {
      margin-bottom: 7px;
      padding-bottom: 6px;
      border-bottom: var(--history-byes-border);
    }
    .hist-match-block:last-child { border-bottom: none; margin-bottom: 0; }
    .hist-court-label {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .hist-edit-row {
      display: grid;
      grid-template-columns: 1fr 54px;
      gap: 5px;
      align-items: center;
      margin-bottom: 4px;
    }
    .hist-team-name {
      font-family: var(--font-body);
      font-size: 0.78rem;
      color: var(--history-item-color);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hist-team-name.is-winner {
      color: var(--history-winner-color);
      font-weight: 800;
    }
    .hist-score-input {
      width: 100%;
      margin-bottom: 0;
      padding: 5px 4px;
      font-size: 0.8rem;
      text-align: center;
    }
    #historyMsg { margin-top: 8px; }
    .manage-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }
    .manage-row input[type="text"] {
      margin-bottom: 0;
      text-align: left;
    }
    .manage-meta {
      font-family: var(--font-body);
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
      letter-spacing: 0.02em;
    }
    .mini-btn {
      width: auto;
      margin-top: 0;
      padding: 8px 11px;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      line-height: 1;
    }
    .add-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: var(--h3-border);
    }
    .add-row input[type="text"] { margin-bottom: 0; text-align: left; }
    .add-row button { margin-top: 0; }
    @media (max-width: 480px) {
      .manage-meta { display: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Dink Club logo -->

    <h1 id="eventTitle" title="Click to rename this event">Teams Gauntlet</h1>
    <div class="title-hint">Tap the title above to name your event</div>
    <div class="sub" id="tagline"></div>
    <!-- Always-available theme switcher -->
    <div class="theme-bar" id="themeBar">
      <span class="theme-bar-label">Theme</span>
      <button class="theme-chip" data-theme-key="miami" onclick="chooseTheme('miami')">🌴 Miami</button>
      <button class="theme-chip" data-theme-key="food" onclick="chooseTheme('food')">🍔 Food</button>
      <button class="theme-chip" data-theme-key="got" onclick="chooseTheme('got')">⚔️ Thrones</button>
    </div>
    <!-- SETUP -->
    <div class="card" id="setupCard">
      <h3>Event Format</h3>
      <div class="theme-picker" id="modePicker">
        <button class="theme-option" data-mode-key="teams" onclick="chooseMode('teams')">
          <span class="to-name">👥 Set Teams</span>
          <span class="to-desc">Partners are fixed. Enter team names and they stay together all night, climbing the courts as a pair.</span>
        </button>
        <button class="theme-option" data-mode-key="singles" onclick="chooseMode('singles')">
          <span class="to-name">🔀 Round Robin Singles</span>
          <span class="to-desc">Enter individual players. Opening partners are drawn at random, then reshuffled every round — you rise or fall on your own record.</span>
        </button>
      </div>
      <h3 style="margin-top:14px;">Choose Your Theme</h3>
      <div class="theme-picker" id="themePicker">
        <button class="theme-option" data-theme-key="miami" onclick="chooseTheme('miami')">
          <span class="to-name">🌴 Miami — Dink Club</span>
          <span class="to-desc">Clean white &amp; black with hot pink and ocean blue. Bright and easy to read outdoors.</span>
          <span class="swatches">
            <span class="swatch" style="background:#ffffff"></span>
            <span class="swatch" style="background:#ff2e93"></span>
            <span class="swatch" style="background:#00c2ff"></span>
            <span class="swatch" style="background:#14161a"></span>
          </span>
        </button>
        <button class="theme-option" data-theme-key="food" onclick="chooseTheme('food')">
          <span class="to-name">🍔 Burgers, Pizza &amp; Beer</span>
          <span class="to-desc">Warm cream with ketchup red and mustard gold. Built for burger, taco and beer nights.</span>
          <span class="swatches">
            <span class="swatch" style="background:#fffaf2"></span>
            <span class="swatch" style="background:#e0452c"></span>
            <span class="swatch" style="background:#f5a524"></span>
            <span class="swatch" style="background:#6a9a3a"></span>
          </span>
        </button>
        <button class="theme-option" data-theme-key="got" onclick="chooseTheme('got')">
          <span class="to-name">⚔️ Game of Thrones</span>
          <span class="to-desc">Dark and gold, with houses, keeps and battle history. Best indoors or under the lights.</span>
          <span class="swatches">
            <span class="swatch" style="background:#0a0e1c"></span>
            <span class="swatch" style="background:#d4a853"></span>
            <span class="swatch" style="background:#8b1a1a"></span>
            <span class="swatch" style="background:#e8dcc4"></span>
          </span>
        </button>
      </div>
      <h3 id="teamsHeading" style="margin-top:14px;">1️⃣ Enter Team Names (min 4, max 13)</h3>
      <div class="grid-2" id="teamInputs"></div>
      <button class="btn-primary" id="startBtn" onclick="startEvent()">Start Teams Gauntlet</button>
      <div id="setupMsg" class="message"></div>
    </div>
    <div class="layout-stack">
      <!-- STANDINGS -->
      <div class="card" id="standingsCard" style="display:none;">
        <h3 id="standingsHeading">🏆 Standings</h3>
        <div id="standingsContainer"></div>
      </div>
      <!-- COURTS -->
      <div class="card" id="courtsCard" style="display:none;">
        <h3 id="roundHeading">2️⃣ Round 1 – Enter Scores Only</h3>
        <div class="round-info-row">
          <div id="roundInfo"></div>
          <button class="link-btn" id="resetCourtNamesBtn" onclick="resetCourtNames()" style="display:none;">↺ Reset court names</button>
        </div>
        <div id="courtsContainer"></div>
        <div class="button-row">
          <button class="btn-primary" onclick="applyResults()">Apply Results ➜ Next Round</button>
          <button class="btn-danger" onclick="hardResetTeams()">Reset All Teams &amp; Start Over</button>
        </div>
        <div class="button-row">
          <button class="btn-secondary" onclick="resetStats()">Reset Wins/Losses</button>
          <button class="btn-danger" onclick="undoLastRound()">Undo Last Round</button>
        </div>
        <div id="roundMsg" class="message"></div>
      </div>
      <!-- MANAGE TEAMS -->
      <div class="card" id="manageCard" style="display:none;">
        <h3 class="collapsible" id="manageHeading" onclick="toggleManage()">
          <span id="manageTitle">👥 Edit Teams</span>
          <span class="caret">▾</span>
        </h3>
        <div id="manageBody" style="display:none;">
          <div class="manage-hint">
            <span id="manageHint"></span>
          </div>
          <div id="manageContainer"></div>
          <div class="add-row">
            <input type="text" id="addTeamInput" placeholder="Add a team…" maxlength="30" />
            <button class="btn-secondary" onclick="addTeam()">+ Add</button>
          </div>
          <div id="manageMsg" class="message"></div>
        </div>
      </div>
      <!-- HISTORY -->
      <div class="card" id="historyCard" style="display:none;">
        <h3 class="h3-row">
          <span id="historyHeading">📜 Match History</span>
          <button class="link-btn" id="historyEditBtn" onclick="toggleHistoryEdit()">✎ Fix a score</button>
        </h3>
        <div id="historyContainer" class="history-flex"></div>
        <div id="historyMsg" class="message"></div>
      </div>
    </div>
  </div>
  <script>
    // ===== Persistence key =====
    // Kept stable across renames/re-themes so an event already in progress
    // in someone's browser isn't lost.
    var STORAGE_KEY = "dink_of_thrones_state_v5";
    var MAX_TEAMS = 13;          // set-teams cap; singles uses maxEntrants() (27)

                  '<span class="diff">' + t.pointsFor + ' pts</span>' +
                  ' \u2022 ' + (diff >= 0 ? '+' : '') + diff +
                  ' \u2022 Byes: ' + byeCount;
        } else {
          var dpg = games > 0 ? diff / games : 0;
          stats = '<span class="win">' + t.wins + '</span>-<span class="loss">' + t.losses + '</span>' +
                  '<span class="diff">PD/G ' + dpg.toFixed(1) + '</span>' +
                  ' \u2022 ' + (pct * 100).toFixed(0) + '%' +
                  ' \u2022 Byes: ' + byeCount;
        }
        html +=
          '<div class="stand-team' + rowClass + '">' +
            '<span><span class="rank-badge' + rankClass + '">' + (i + 1) + '</span>' +
              escapeHTML(t.name) + '</span>' +
            '<span>' + stats + '</span>' +
          '</div>';
      }
      standingsContainer.innerHTML = html;
    }
    function renderHistory() {
      if (historyEditBtn) {
        historyEditBtn.textContent = historyEditMode ? "\u2713 Done editing" : "\u270e Fix a score";
        historyEditBtn.style.display = roundHistory.length ? "inline-block" : "none";
      }
      historyContainer.className = "history-flex" + (historyEditMode ? " editing" : "");
      if (!roundHistory.length) {
        historyEditMode = false;
        historyContainer.innerHTML = '<div class="history-round">No rounds played yet.</div>';
        return;
      }
      var html = "";
      for (var i = 0; i < roundHistory.length; i++) {
        var r = roundHistory[i];
        html += '<div class="history-round">';
        html += '<div class="history-header">Round ' + r.round + '</div>';
        if (r.byes && r.byes.length > 0) {
          html += '<div class="history-byes"><strong>Byes:</strong> ' +
                  r.byes.map(escapeHTML).join(", ") + '</div>';
        }
        for (var j = 0; j < r.matches.length; j++) {
          var m = r.matches[j];
          var nameA = matchSideLabel(m, "a"), nameB = matchSideLabel(m, "b");
          if (historyEditMode) {
            var aWins = m.scoreA > m.scoreB;
            html +=
              '<div class="hist-match-block">' +
                '<div class="hist-court-label">Court ' + m.court + '</div>' +
                '<div class="hist-edit-row">' +
                  '<span class="hist-team-name' + (aWins ? ' is-winner' : '') + '" title="' +
                    escapeHTML(nameA) + '">' + escapeHTML(nameA) + '</span>' +
                  '<input type="number" min="0" class="hist-score-input" data-hist="' +
                    i + '_' + j + '_a" value="' + m.scoreA + '" />' +
                '</div>' +
                '<div class="hist-edit-row">' +
                  '<span class="hist-team-name' + (!aWins ? ' is-winner' : '') + '" title="' +
                    escapeHTML(nameB) + '">' + escapeHTML(nameB) + '</span>' +
                  '<input type="number" min="0" class="hist-score-input" data-hist="' +
                    i + '_' + j + '_b" value="' + m.scoreB + '" />' +
                '</div>' +
              '</div>';
          } else {
            html +=
              '<div class="history-item">Court ' + m.court + ': ' +
              escapeHTML(nameA) + ' ' + m.scoreA + ' vs ' +
              escapeHTML(nameB) + ' ' + m.scoreB +
              ' \u2013 <span class="history-winner">' + escapeHTML(m.winner) + '</span></div>';
          }
        }
        html += '</div>';
      }
      historyContainer.innerHTML = html;
    }
    // ===== Apply Results / Next Round =====
    function applyResults() {
      setMsg(roundMsg, "", "");
      if (!courts.length) { setMsg(roundMsg, "No courts are set up.", "error"); return; }
      var snapshot = {
        teams: JSON.parse(JSON.stringify(teams)),
        courts: JSON.parse(JSON.stringify(courts)),
        currentRound: currentRound,
        roundHistory: JSON.parse(JSON.stringify(roundHistory)),
        currentRoundByes: (currentRoundByes || []).map(function (t) { return t ? t.id : null; }),
        partnerCounts: JSON.parse(JSON.stringify(partnerCounts))
      };
      stateStack.push(snapshot);
      var matches = [];
      for (var i = 0; i < courts.length; i++) {
        var inA = document.getElementById("score_" + i + "_a");
        var inB = document.getElementById("score_" + i + "_b");
        if (!inA || !inB) continue;
        var scoreA = parseInt(inA.value, 10);
        var scoreB = parseInt(inB.value, 10);
        if (isNaN(scoreA) || isNaN(scoreB)) {
          setMsg(roundMsg, "Enter scores for all courts.", "error"); stateStack.pop(); return;
        }
        var aIds = sideIds(i, 0), bIds = sideIds(i, 1);
        var aTeams = sideTeams(aIds), bTeams = sideTeams(bIds);
        if (aTeams.length !== aIds.length || bTeams.length !== bIds.length || !aTeams.length || !bTeams.length) {
          setMsg(roundMsg, "Invalid line-up on Court " + (i + 1) + ".", "error"); stateStack.pop(); return;
        }
        if (scoreA === scoreB) {
          setMsg(roundMsg, "No ties allowed on Court " + (i + 1) + ".", "error"); stateStack.pop(); return;
        }
        var winners = scoreA > scoreB ? aTeams : bTeams;
        var losers  = scoreA > scoreB ? bTeams : aTeams;
        var winScore = Math.max(scoreA, scoreB);
        var loseScore = Math.min(scoreA, scoreB);
        var w, t;
        for (w = 0; w < winners.length; w++) {
          t = winners[w];
          t.wins += 1; t.pointsFor += winScore; t.pointsAgainst += loseScore;
        }
        for (w = 0; w < losers.length; w++) {
          t = losers[w];
          t.losses += 1; t.pointsFor += loseScore; t.pointsAgainst += winScore;
        }
        if (isSingles()) { bumpPartners(aIds); bumpPartners(bIds); }
        matches.push({
          court: i + 1,
          sideAIds: aIds.slice(),
          sideBIds: bIds.slice(),
          sideA: sideLabel(aIds),
          sideB: sideLabel(bIds),
          scoreA: scoreA,
          scoreB: scoreB,
          winner: winners.map(function (x) { return x.name; }).join(" & "),
          winnerIds: winners.map(function (x) { return x.id; })
        });
      }
      roundHistory.push({
        round: currentRound,
        mode: mode,
        matches: matches,
        byes: (currentRoundByes || []).map(function (t) { return t ? t.name : ""; }),
        byeIds: (currentRoundByes || []).map(function (t) { return t ? t.id : null; })
      });
      currentRound += 1;
      clearPendingScores();
      var next = assignCourtsForNextRound();
      renderCourts(); renderStandings(); renderHistory(); renderManage();
      saveState();
      if (next.byeTeams.length > 0) {
        setMsg(roundMsg, "Round " + (currentRound - 1) + " applied. Next round ready. Byes this round: " +
          next.byeTeams.map(function (t) { return t.name; }).join(", ") + ".", "success");
      } else {
        setMsg(roundMsg, "Round " + (currentRound - 1) + " applied. Next round ready. No byes.", "success");
      }
    }
    // ===== Resets / Undo =====
    function resetStats() {
      if (!teams.length) return;
      if (!confirm("Reset wins/losses and point totals, but keep the teams and start again at Round 1?")) return;
      for (var i = 0; i < teams.length; i++) {
        teams[i].wins = 0;
        teams[i].losses = 0;
        teams[i].pointsFor = 0;
        teams[i].pointsAgainst = 0;
        teams[i].byeCount = 0;
      }
      currentRound = 1;
      roundHistory = [];
      stateStack = [];
      currentRoundByes = [];
      clearPendingScores();
      var first = assignCourtsForNextRound();
      renderCourts();
      renderStandings();
      renderHistory();
      renderManage();
      saveState();
      if (first.byeTeams.length > 0) {
        var byeNames = first.byeTeams.map(function (t) { return t.name; }).join(", ");
        setMsg(roundMsg, "Stats reset. Round 1 rebuilt. Byes this round: " + byeNames + ".", "success");
      } else {
        setMsg(roundMsg, "Stats reset. Round 1 rebuilt. No byes this round.", "success");
      }
    }
    function undoLastRound() {
      if (!stateStack.length) {
        setMsg(roundMsg, "Nothing to undo.", "error");
        return;
      }
      var snapshot = stateStack.pop();
      teams = snapshot.teams;
      courts = snapshot.courts;
      currentRound = snapshot.currentRound;
      roundHistory = snapshot.roundHistory;
      // byes were stored as ids so they re-link to the restored team objects
      if (snapshot.partnerCounts) partnerCounts = snapshot.partnerCounts;
      currentRoundByes = [];
      var ids = snapshot.currentRoundByes || [];
      for (var i = 0; i < ids.length; i++) {
        var live = getTeamById(ids[i]);
        if (live) currentRoundByes.push(live);
      }
      clearPendingScores();
      renderCourts();
      renderStandings();
      renderHistory();
      renderManage();
      saveState();
      setMsg(roundMsg, "Last round undone.", "success");
    }
    function hardResetTeams() {
      if (!confirm("Are you sure you want to reset ALL teams and start over? This will clear history and byes.")) return;
      teams = [];
      courts = [];
      currentRound = 1;
      roundHistory = [];
      stateStack = [];
      currentRoundByes = [];
      clearPendingScores();
      eventStarted = false;
      manageOpen = false;
      historyEditMode = false;
      manageBody.style.display = "none";
      manageHeading.classList.remove("open");
      clearSavedState();
      setupCard.style.display = "block";
      courtsCard.style.display = "none";
      standingsCard.style.display = "none";
      manageCard.style.display = "none";
      historyCard.style.display = "none";
      buildTeamInputs();
      eventName = theme().eventName;
      renderEventTitle();
      setMsg(roundMsg, "", "");
      setMsg(setupMsg, "All teams cleared. Pick a theme and enter new teams to start a fresh event.", "success");
    }
    // ===== Boot =====
    loadSavedState();
    buildTeamInputs();
    applyTheme();
    if (eventStarted) {
      renderCourts();
      renderStandings();
      renderHistory();
      renderManage();
    }
  </script>
</body>
</html>
